name: 원주시청 소식 하루 2번 수집

on:
  schedule:
    # 오전 8시, 오후 6시 (한국 시간) = 23:00, 09:00 UTC
    - cron: '0 23 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sync-notices.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
